name: Browser VanillaTD engine compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'tiberiandawn/**'
      - 'browser/engine/**'
      - 'game/content/**'
      - 'tools/content/**'
      - 'common/**'
      - 'cmake/**'
      - '.github/workflows/browser-engine.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'tiberiandawn/**'
      - 'browser/engine/**'
      - 'game/content/**'
      - 'tools/content/**'
      - 'common/**'
      - 'cmake/**'
      - '.github/workflows/browser-engine.yml'

permissions:
  contents: read

jobs:
  wasm-vanillatd:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build
      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: '3.1.68'
      - name: Toolchain versions
        run: |
          em++ --version
          cmake --version
          ninja --version
      - name: Configure browser engine target
        run: |
          emcmake cmake -S . -B build/browser-engine -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_VANILLATD=ON -DBUILD_VANILLARA=OFF \
            -DBUILD_REMASTERTD=OFF -DBUILD_REMASTERRA=OFF \
            -DNETWORKING=OFF -DOPENAL=OFF -DSDL2=ON \
            -DBUILD_TOOLS=OFF -DBUILD_TESTS=OFF
      - name: Compile actual VanillaTD engine
        run: cmake --build build/browser-engine --target VanillaTD --parallel 2
      - name: Verify compiled WebAssembly bundle
        run: |
          test -s build/browser-engine/vanillatd.html
          test -s build/browser-engine/vanillatd.js
          test -s build/browser-engine/vanillatd.wasm
          test -s browser/engine/asset-import.js
          cp browser/engine/asset-import.js build/browser-engine/asset-import.js
          cp browser/engine/original-asset.js build/browser-engine/original-asset.js
          cp browser/engine/wireframe-asset.js build/browser-engine/wireframe-asset.js
          cp browser/engine/cargo-hd.js build/browser-engine/cargo-hd.js
          cp browser/engine/vertical-slice.js build/browser-engine/vertical-slice.js
          cp browser/engine/mission-pack.js build/browser-engine/mission-pack.js
          cp browser/engine/tactical-hud.js build/browser-engine/tactical-hud.js
          cp browser/engine/simulation-bridge.js build/browser-engine/simulation-bridge.js
          cp browser/engine/rts-camera.js browser/engine/rts-input-ui.js build/browser-engine/
          cp browser/engine/play.html build/browser-engine/play.html
          mkdir -p build/browser-engine/missions
          cp game/content/missions/*.map game/content/missions/manifest.json build/browser-engine/missions/
          mkdir -p build/browser-engine/cargo-hd
          cp game/content/wireframes/hd/WF-0002/*.png game/content/wireframes/hd/WF-0002/manifest.json build/browser-engine/cargo-hd/
          # Verify we generated the custom deferred-start launcher.
          grep -q 'id="canvas"' build/browser-engine/vanillatd.html
          grep -q 'id="run-probe"' build/browser-engine/vanillatd.html
      - name: Verify asset loader with synthetic data
        run: |
          node browser/engine/test-asset-import.js
          node browser/engine/test-original-asset.js
          node browser/engine/test-wireframe-asset.js
          node browser/engine/test-cargo-hd.js
          node browser/engine/test-vertical-slice.js
          node browser/engine/test-mission-pack.js
          node browser/engine/validate-maps.js
          node browser/engine/test-tactical-hud.js
          node browser/engine/test-simulation-bridge.js
          node browser/engine/test-rts-camera.js
          node browser/engine/test-package-alpha.js
          node docs/rts-milestones/validate-roadmap.js
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-native-slice.cpp -o build/browser-engine/test-native-slice
          build/browser-engine/test-native-slice
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-world-plan.cpp -o build/browser-engine/test-world-plan
          build/browser-engine/test-world-plan
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-map-pipeline.cpp -o build/browser-engine/test-map-pipeline
          build/browser-engine/test-map-pipeline
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-combat.cpp -o build/browser-engine/test-combat
          build/browser-engine/test-combat
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-rts-weapons.cpp -o build/browser-engine/test-rts-weapons
          build/browser-engine/test-rts-weapons
          node docs/rts-milestones/validate-roadmap.js
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-simulation-contract.cpp -o build/browser-engine/test-simulation-contract
          build/browser-engine/test-simulation-contract
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/test-production-orders.cpp -o build/browser-engine/test-production-orders
          build/browser-engine/test-production-orders
          g++ -std=c++11 -Wall -Wextra -Werror -Ibrowser/engine browser/engine/replay-native-slice.cpp -o build/browser-engine/replay-native-slice
          node browser/engine/test-replay-parity.js build/browser-engine/replay-native-slice
          # The historical engine headers require the same compile definitions as VanillaTD.
          # Compile-only here; the linked WASM runtime exercises target encoding in Chromium.
          g++ -std=c++11 -DTRUE_FALSE_DEFINED -DMEGAMAPS -isystem . -isystem common -Ibrowser/engine -c browser/engine/test-engine-target.cpp -o build/browser-engine/test-engine-target.o
          g++ -std=c++11 -DTRUE_FALSE_DEFINED -DMEGAMAPS -isystem . -isystem common -Ibrowser/engine -c browser/engine/test-engine-foot.cpp -o build/browser-engine/test-engine-foot.o
          g++ -std=c++11 -DTRUE_FALSE_DEFINED -DMEGAMAPS -isystem . -isystem common -Ibrowser/engine -c browser/engine/test-engine-map.cpp -o build/browser-engine/test-engine-map.o
          test -s browser/engine/play.html
          test -s build/browser-engine/play.html
      - name: Verify original content pipeline
        run: |
          node tools/content/test-build.js
          node tools/content/test-wireframes.js
          node tools/content/test-representative-contracts.js
          node tools/content/test-representative-animation.js
          node tools/content/test-first-pass-art.js
          node tools/content/test-cargo-plane-art.js
          node tools/content/test-r05.js
          node tools/content/build.js game/content/manifest.json build/browser-engine/content
          node tools/content/wireframes.js build build/browser-engine/wireframes --representative
          node tools/content/r05.js build build/browser-engine/r05
          node browser/engine/test-wireframe-asset.js build/browser-engine/wireframes
          test -s build/browser-engine/content/manifest.json
          test -s build/browser-engine/wireframes/roster.json
          test -s build/browser-engine/wireframes/contracts.json
          test -s build/browser-engine/wireframes/game-root/FACTMAKE.SHP
          test -s build/browser-engine/r05/manifest.json
          test -s build/browser-engine/r05/atlases/atlas-0.png
          test -s build/browser-engine/r05/shapes/r05.aster.ranger.SHP
          g++ -std=c++11 -Icommon tests/test-original-shape.cpp common/lcw.cpp -o build/browser-engine/test-original-shape
          build/browser-engine/test-original-shape build/browser-engine/content/files/units/SCOUT.SHP
          g++ -std=c++11 -Icommon tests/test-wireframe-shapes.cpp common/lcw.cpp -o build/browser-engine/test-wireframe-shapes
          build/browser-engine/test-wireframe-shapes \
            build/browser-engine/wireframes/files/infantry/WF-0185.SHP \
            build/browser-engine/wireframes/files/vehicle/WF-0289.SHP \
            build/browser-engine/wireframes/files/aircraft/WF-0004.SHP \
            build/browser-engine/wireframes/files/building/WF-0013.SHP \
            build/browser-engine/wireframes/files/terrain/WF-0256.SHP \
            build/browser-engine/wireframes/files/effect/WF-0072.SHP \
            build/browser-engine/wireframes/files/building/FACTMAKE.SHP
      - name: Install headless browser tooling
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install --with-deps chromium
      - name: Test actual engine in headless Chromium
        run: |
          node browser/engine/check-r01-ui.js
          node browser/engine/check-runtime.js
          node browser/engine/check-r05-gallery.js build/browser-engine/r05
      - name: Package Pages-ready native tactical alpha
        run: node browser/engine/package-alpha.js build/browser-engine build/tactical-alpha-site "$GITHUB_SHA"
      - name: Upload browser probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanillatd-browser-probe
          path: |
            build/browser-engine/browser-probe.png
            build/browser-engine/browser-probe.log
            build/browser-engine/r01-desktop.png
            build/browser-engine/r01-compact.png
            build/browser-engine/r05/gallery-proof.png
            build/browser-engine/r02-orders.png
            build/browser-engine/r03-defeat.png
          if-no-files-found: ignore
      - name: Upload standalone original-content mission
        uses: actions/upload-artifact@v4
        with:
          name: world-conquer-courier-playable
          path: |
            build/browser-engine/play.html
            build/browser-engine/vertical-slice.js
            build/browser-engine/mission-pack.js
            build/browser-engine/missions/**
          if-no-files-found: error
      - name: Upload engine HTML/JS/WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: |
            build/browser-engine/vanillatd.html
            build/browser-engine/vanillatd.js
            build/browser-engine/vanillatd.wasm
            build/browser-engine/asset-import.js
            build/browser-engine/original-asset.js
            build/browser-engine/wireframe-asset.js
            build/browser-engine/cargo-hd.js
            build/browser-engine/vertical-slice.js
            build/browser-engine/mission-pack.js
            build/browser-engine/tactical-hud.js
            build/browser-engine/simulation-bridge.js
            build/browser-engine/rts-camera.js
            build/browser-engine/rts-input-ui.js
            build/browser-engine/missions/**
            build/browser-engine/play.html
            build/browser-engine/cargo-hd/**
            build/browser-engine/content/**
            build/browser-engine/wireframes/**
            build/browser-engine/r05/**
          if-no-files-found: error
      - name: Upload Pages-ready native tactical alpha
        uses: actions/upload-artifact@v4
        with:
          name: world-conquer-tactical-alpha-site
          path: build/tactical-alpha-site/**
          include-hidden-files: true
          if-no-files-found: error
