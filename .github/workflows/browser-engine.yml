name: Browser VanillaTD engine compile

on:
  workflow_dispatch:
  push:
    branches: [vanilla]
    paths:
      - 'CMakeLists.txt'
      - 'tiberiandawn/**'
      - 'browser/engine/**'
      - 'game/content/**'
      - 'tools/content/**'
      - 'common/**'
      - 'cmake/**'
      - '.github/workflows/browser-engine.yml'
  # Always create the browser smoke check on every PR. It is a candidate
  # required branch-protection check; path-filtered PRs would otherwise leave
  # "wasm-vanillatd" permanently pending on documentation-only changes.
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm-vanillatd:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate UI design sources
        run: |
          node tools/content/ui/test-ui-spec.js
          node tools/content/ui/mockups.js build/ui-mockups
          node tools/content/ui/audit-palette-impact.js > build/ui-mockups/palette-impact.json
      - name: Publish UI design evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-design-evidence
          path: build/ui-mockups/
      - name: Install Ninja
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 ninja-build
          fi
      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: '3.1.68'
      - name: Toolchain versions
        run: |
          em++ --version
          cmake --version
          ninja --version
      - name: Configure browser engine target
        run: |
          emcmake cmake -S . -B build/browser-engine -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_VANILLATD=ON -DBUILD_VANILLARA=OFF \
            -DBUILD_REMASTERTD=OFF -DBUILD_REMASTERRA=OFF \
            -DNETWORKING=OFF -DOPENAL=ON -DSDL2=ON \
            -DBUILD_TOOLS=OFF -DBUILD_TESTS=OFF
      - name: Compile actual VanillaTD engine
        run: cmake --build build/browser-engine --target VanillaTD --parallel 2
      - name: Generate original M1 boot data
        run: |
          # M5: the sound pack's voices are spoken by flite (tools/content/sound.js).
          sudo apt-get install -y -o Acquire::Retries=3 flite || (sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 flite)
          flite -lv
          cmake -S . -B build/native -G Ninja \
            -DBUILD_VANILLATD=OFF -DBUILD_VANILLARA=OFF \
            -DBUILD_REMASTERTD=OFF -DBUILD_REMASTERRA=OFF \
            -DOPENAL=OFF -DSDL2=OFF -DNETWORKING=OFF \
            -DBUILD_TOOLS=ON -DBUILD_TESTS=OFF
          cmake --build build/native --target vanillamix --parallel 2
          build/native/vanillamix --help
          # Phase 1: verify the shared file layer compiles both with and without
          # asset auditing enabled; the default native configuration is OFF.
          cmake -S . -B build/native -DWC_ASSET_AUDIT=ON
          cmake --build build/native --target common --parallel 2
          cmake -S . -B build/native -DWC_ASSET_AUDIT=OFF
          cmake --build build/native --target common --parallel 2
          node tools/content/test-boot-pack.js
          node tools/content/test-pack.js
          node tools/content/test-iconset.js
          node tools/content/test-wsa.js
          node tools/content/test-scenario.js
          node tools/content/art/test-art.js
          node -e 'require("fs").writeFileSync("build/native/test-m2.icn",require("./tools/content/encode-iconset.js").encodeIconset({icons:[Array(576).fill(42)]}))'
          g++ -std=c++11 -DTRUE_FALSE_DEFINED -include cstdint -I. -Icommon -Itiberiandawn tests/test-m2-iconset.cpp tiberiandawn/iconset.cpp build/native/common/libcommon.a -lpthread -ldl -o build/native/test-m2-iconset
          build/native/test-m2-iconset build/native/test-m2.icn
          node tools/content/pack.js build build/browser-engine/data
          node tools/content/test-theater.js build/browser-engine/data/game
          # The engine reads its palette tables from data (display.cpp:129
          # _RETRIEVE). Check the generated tables against its own builders.
          node -e 'const fs=require("fs"),f=require("./tools/content/fading.js");const d="build/native/m2-fading";fs.mkdirSync(d,{recursive:true});const p=fs.readFileSync("build/browser-engine/data/game/TEMPERAT.PAL");fs.writeFileSync(d+"/TEMPERAT.PAL",p);for(const [n,b] of Object.entries(f.tables(p,"T")))fs.writeFileSync(d+"/"+n,b)'
          g++ -std=c++11 -Icommon tests/test-m2-fading.cpp common/fading.cpp -o build/native/test-m2-fading
          build/native/test-m2-fading build/native/m2-fading
          g++ -std=c++11 -Icommon tests/test-m1-boot-data.cpp common/lcw.cpp -o build/native/test-m1-boot-data
          build/native/test-m1-boot-data \
            build/browser-engine/data/game/8POINT.FNT \
            build/browser-engine/data/game/PREPICK.CPS
          cp game/content/pack/boot-requirements.json build/browser-engine/data/boot-requirements.json
      - name: Verify compiled WebAssembly bundle
        run: |
          test -s build/browser-engine/vanillatd.html
          test -s build/browser-engine/vanillatd.js
          test -s build/browser-engine/vanillatd.wasm
          test -s browser/engine/asset-import.js
          cp browser/engine/asset-import.js build/browser-engine/asset-import.js
          cp browser/engine/asset-audit.js build/browser-engine/asset-audit.js
          cp browser/engine/pack-loader.js build/browser-engine/pack-loader.js
          cp browser/engine/original-asset.js build/browser-engine/original-asset.js
          cp browser/engine/wireframe-asset.js build/browser-engine/wireframe-asset.js
          # Verify we generated the custom deferred-start launcher.
          grep -q 'id="canvas"' build/browser-engine/vanillatd.html
          grep -q 'id="run-probe"' build/browser-engine/vanillatd.html
      - name: Verify asset loader with synthetic data
        run: |
          node browser/engine/test-asset-audit.js
          node browser/engine/test-pack-loader.js
          node browser/engine/test-asset-import.js
          node browser/engine/test-original-asset.js
          node browser/engine/test-wireframe-asset.js
      - name: Verify original content pipeline
        run: |
          node tools/content/test-build.js
          node tools/content/test-wireframes.js
          node tools/content/test-representative-contracts.js
          node tools/content/test-representative-animation.js
          node tools/content/test-first-pass-art.js
          node tools/content/test-cargo-plane-art.js
          node tools/content/test-r05.js
          node tools/content/build.js game/content/manifest.json build/browser-engine/content
          node tools/content/wireframes.js build build/browser-engine/wireframes --representative
          node tools/content/r05.js build build/browser-engine/r05
          node browser/engine/test-wireframe-asset.js build/browser-engine/wireframes
          test -s build/browser-engine/content/manifest.json
          test -s build/browser-engine/wireframes/roster.json
          test -s build/browser-engine/wireframes/contracts.json
          test -s build/browser-engine/wireframes/game-root/FACTMAKE.SHP
          test -s build/browser-engine/r05/manifest.json
          test -s build/browser-engine/r05/atlases/atlas-0.png
          test -s build/browser-engine/r05/shapes/r05.aster.ranger.SHP
          g++ -std=c++11 -Icommon tests/test-original-shape.cpp common/lcw.cpp -o build/browser-engine/test-original-shape
          build/browser-engine/test-original-shape build/browser-engine/content/files/units/SCOUT.SHP
          g++ -std=c++11 -Icommon tests/test-wireframe-shapes.cpp common/lcw.cpp -o build/browser-engine/test-wireframe-shapes
          build/browser-engine/test-wireframe-shapes \
            build/browser-engine/wireframes/files/infantry/WF-0185.SHP \
            build/browser-engine/wireframes/files/vehicle/WF-0289.SHP \
            build/browser-engine/wireframes/files/aircraft/WF-0004.SHP \
            build/browser-engine/wireframes/files/building/WF-0013.SHP \
            build/browser-engine/wireframes/files/terrain/WF-0256.SHP \
            build/browser-engine/wireframes/files/effect/WF-0072.SHP \
            build/browser-engine/wireframes/files/building/FACTMAKE.SHP
      - name: Restore Chromium browser cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: playwright-chromium-1.56.1-${{ runner.os }}
      - name: Install headless browser tooling
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          # Avoid an unconditional apt update/install: hosted runners often
          # already have Chromium's native libraries. Probe a real launch and
          # install system dependencies only when that probe fails.
          npm exec --prefix browser/engine -- playwright install chromium
          if ! node -e 'const {chromium}=require("./browser/engine/node_modules/playwright"); chromium.launch({headless:true,args:["--no-sandbox"]}).then(browser=>browser.close()).catch(err=>{console.error(err.message);process.exitCode=1;})'; then
            npm exec --prefix browser/engine -- playwright install-deps chromium
            node -e 'const {chromium}=require("./browser/engine/node_modules/playwright"); chromium.launch({headless:true,args:["--no-sandbox"]}).then(browser=>browser.close()).catch(err=>{console.error(err);process.exitCode=1;})'
          fi
      - name: Test engine diagnostics in headless Chromium
        run: |
          node browser/engine/check-runtime.js
          node browser/engine/check-r05-gallery.js build/browser-engine/r05
      - name: Upload browser probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanillatd-browser-probe
          path: |
            build/browser-engine/browser-probe.png
            build/browser-engine/browser-probe.log
            build/browser-engine/r05/gallery-proof.png
          if-no-files-found: ignore
      - name: Upload original M2 data pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-conquer-data-pack
          path: |
            build/browser-engine/data/**
          if-no-files-found: ignore
      - name: Upload engine HTML/JS/WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: |
            build/browser-engine/vanillatd.html
            build/browser-engine/vanillatd.js
            build/browser-engine/vanillatd.wasm
            build/browser-engine/asset-import.js
            build/browser-engine/asset-audit.js
            build/browser-engine/pack-loader.js
            build/browser-engine/original-asset.js
            build/browser-engine/wireframe-asset.js
            build/browser-engine/content/**
            build/browser-engine/wireframes/**
            build/browser-engine/r05/**
          if-no-files-found: error

  stock-engine:
    name: stock-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: wasm-vanillatd
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve built stock engine
        uses: actions/download-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: build/browser-engine
      - name: Retrieve original data pack
        uses: actions/download-artifact@v4
        with:
          name: world-conquer-data-pack
          path: build/browser-engine/data
      - name: Install headless Chromium
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install chromium
          npm exec --prefix browser/engine -- playwright install-deps chromium
      - name: Test unmodified main path to stock menu
        run: node browser/engine/check-stock-engine.js
      - name: Publish stock-engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-engine-evidence
          path: |
            build/browser-engine/stock-*.png
            build/browser-engine/stock-engine-metrics.json
            build/browser-engine/stock-engine-audit.log
          if-no-files-found: ignore

  stock-scenario:
    name: stock-scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: wasm-vanillatd
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve built stock engine
        uses: actions/download-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: build/browser-engine
      - name: Retrieve original data pack
        uses: actions/download-artifact@v4
        with:
          name: world-conquer-data-pack
          path: build/browser-engine/data
      - name: Install headless Chromium
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install chromium
          npm exec --prefix browser/engine -- playwright install-deps chromium
      # Strict: a full skirmish on original data with real input only --
      # deploy, build, harvest, train, command, scroll, 2 minutes of play --
      # with zero required or unclassified misses, no fatal or page error and
      # no stall over 1s. M5: no wireframe placeholder is drawn (every match
      # job checks that), and sound plays after the first click.
      - name: Play a skirmish match on original data (strict)
        env:
          # The public play view (published by publish-play.yml).
          STOCK_SCENARIO_PAGE: vanillatd.html?play
          STOCK_SCENARIO_REQUIRE_AUDIO: '1'
        run: node browser/engine/check-stock-scenario.js
      - name: Publish stock-scenario audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-scenario-audit
          path: |
            build/browser-engine/stock-scenario-audit.json
            build/browser-engine/stock-scenario-metrics.json
            build/browser-engine/stock-scenario-log.txt
            build/browser-engine/stock-scenario-*.png
          if-no-files-found: warn

  # M3: a full match against the engine's computer player. The human player
  # deploys and then idles; the computer must build a base, harvest and
  # attack until it wins, the end-of-match score screen must draw, and the
  # game must restart from the skirmish dialog. One map on pull requests
  # (Crossroads, the smallest), all maps on vanilla and manual runs.
  ai-match:
    name: ai-match (map row ${{ matrix.row }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: wasm-vanillatd
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[0, 1, 2]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve built stock engine
        uses: actions/download-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: build/browser-engine
      - name: Retrieve original data pack
        uses: actions/download-artifact@v4
        with:
          name: world-conquer-data-pack
          path: build/browser-engine/data
      - name: Install headless Chromium
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install chromium
          npm exec --prefix browser/engine -- playwright install-deps chromium
      - name: Play to the end against the computer player (strict)
        env:
          STOCK_SCENARIO_MAP_ROW: ${{ matrix.row }}
          STOCK_SCENARIO_SKIP_GAMEPLAY: '1'
          # Matches have taken 9-20 minutes; one ran past 35 when the idle
          # player's starting army held out (run 45749225047, map row 0).
          STOCK_SCENARIO_OBSERVE_MINUTES: '45'
          STOCK_SCENARIO_REQUIRE_END: '1'
        run: node browser/engine/check-stock-scenario.js
      - name: Publish ai-match audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-match-audit-row-${{ matrix.row }}
          path: |
            build/browser-engine/stock-scenario-audit.json
            build/browser-engine/stock-scenario-log.txt
            build/browser-engine/stock-scenario-*.png
          if-no-files-found: warn

  # M3: an automated win. The CI-only test hook (browser/engine/test_hooks.cpp,
  # off in the play site) leaves the computer one weakened building; the
  # player's starting units destroy it with real input, then the win screen
  # and restart are checked.
  win-match:
    name: win-match
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: wasm-vanillatd
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve built stock engine
        uses: actions/download-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: build/browser-engine
      - name: Retrieve original data pack
        uses: actions/download-artifact@v4
        with:
          name: world-conquer-data-pack
          path: build/browser-engine/data
      - name: Install headless Chromium
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install chromium
          npm exec --prefix browser/engine -- playwright install-deps chromium
      - name: Win a match against the computer player (strict)
        env:
          STOCK_SCENARIO_SKIP_GAMEPLAY: '1'
          STOCK_SCENARIO_WIN: '1'
          # F12 full screen (shell.html): the match is played in full screen
          # and every click must land on its game pixel.
          STOCK_SCENARIO_FULLSCREEN: '1'
        run: node browser/engine/check-stock-scenario.js
      - name: Publish win-match audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-match-audit
          path: |
            build/browser-engine/stock-scenario-audit.json
            build/browser-engine/stock-scenario-log.txt
            build/browser-engine/stock-scenario-*.png
          if-no-files-found: warn

  # M4 browser reach: the stock engine and a full skirmish in Firefox and
  # WebKit (Safari's engine) as well as Chromium. Required: both passed on
  # their first run (45744231306), so a failure here now blocks publishing.
  browser-reach:
    name: browser-reach (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: wasm-vanillatd
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve built stock engine
        uses: actions/download-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: build/browser-engine
      - name: Retrieve original data pack
        uses: actions/download-artifact@v4
        with:
          name: world-conquer-data-pack
          path: build/browser-engine/data
      - name: Install headless ${{ matrix.browser }}
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install ${{ matrix.browser }}
          npm exec --prefix browser/engine -- playwright install-deps ${{ matrix.browser }}
      - name: Stock engine reaches its menu
        env:
          WC_BROWSER: ${{ matrix.browser }}
        run: node browser/engine/check-stock-engine.js
      - name: Play a skirmish match on original data (strict)
        if: always()
        env:
          WC_BROWSER: ${{ matrix.browser }}
          STOCK_SCENARIO_PAGE: vanillatd.html?play
        run: node browser/engine/check-stock-scenario.js
      - name: Publish browser-reach evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reach-${{ matrix.browser }}
          path: |
            build/browser-engine/stock-*.png
            build/browser-engine/stock-engine-metrics.json
            build/browser-engine/stock-engine-audit.log
            build/browser-engine/stock-scenario-audit.json
            build/browser-engine/stock-scenario-log.txt
          if-no-files-found: warn
