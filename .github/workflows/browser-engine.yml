name: Browser VanillaTD engine compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'tiberiandawn/**'
      - 'browser/engine/**'
      - 'common/**'
      - 'cmake/**'
      - '.github/workflows/browser-engine.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'tiberiandawn/**'
      - 'browser/engine/**'
      - 'common/**'
      - 'cmake/**'
      - '.github/workflows/browser-engine.yml'

permissions:
  contents: read

jobs:
  wasm-vanillatd:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build
      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: '3.1.68'
      - name: Toolchain versions
        run: |
          em++ --version
          cmake --version
          ninja --version
      - name: Configure browser engine target
        run: |
          emcmake cmake -S . -B build/browser-engine -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_VANILLATD=ON -DBUILD_VANILLARA=OFF \
            -DBUILD_REMASTERTD=OFF -DBUILD_REMASTERRA=OFF \
            -DNETWORKING=OFF -DOPENAL=OFF -DSDL2=ON \
            -DBUILD_TOOLS=OFF -DBUILD_TESTS=OFF
      - name: Compile actual VanillaTD engine
        run: cmake --build build/browser-engine --target VanillaTD --parallel 2
      - name: Verify compiled WebAssembly bundle
        run: |
          test -s build/browser-engine/vanillatd.html
          test -s build/browser-engine/vanillatd.js
          test -s build/browser-engine/vanillatd.wasm
          test -s browser/engine/asset-import.js
          cp browser/engine/asset-import.js build/browser-engine/asset-import.js
          # Verify we generated the custom deferred-start launcher.
          grep -q 'id="canvas"' build/browser-engine/vanillatd.html
          grep -q 'id="run-probe"' build/browser-engine/vanillatd.html
      - name: Verify asset loader with synthetic data
        run: node browser/engine/test-asset-import.js
      - name: Install headless browser tooling
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install --with-deps chromium
      - name: Test actual engine in headless Chromium
        run: node browser/engine/check-runtime.js
      - name: Upload browser probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanillatd-browser-probe
          path: |
            build/browser-engine/browser-probe.png
            build/browser-engine/browser-probe.log
          if-no-files-found: ignore
      - name: Upload engine HTML/JS/WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanillatd-engine-wasm
          path: |
            build/browser-engine/vanillatd.html
            build/browser-engine/vanillatd.js
            build/browser-engine/vanillatd.wasm
            build/browser-engine/asset-import.js
          if-no-files-found: error
