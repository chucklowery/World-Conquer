name: linux

on:
  pull_request:
  push:
    branches: [vanilla]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vanilla-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      # PRs cover both compilers, Ubuntu versions and all four presets with
      # four builds. Pushes/tags/manual runs retain the complete 16-build matrix.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"compiler":{"cc":"gcc","cxx":"g++"},"preset":"release","os":"ubuntu-24.04"},{"compiler":{"cc":"clang","cxx":"clang++"},"preset":"testing","os":"ubuntu-24.04"},{"compiler":{"cc":"gcc","cxx":"g++"},"preset":"internal","os":"ubuntu-22.04"},{"compiler":{"cc":"clang","cxx":"clang++"},"preset":"nonet","os":"ubuntu-22.04"}]}' || '{"compiler":[{"cc":"clang","cxx":"clang++"},{"cc":"gcc","cxx":"g++"}],"preset":["release","internal","testing","nonet"],"os":["ubuntu-22.04","ubuntu-24.04"]}') }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 1
        ref: ${{ github.event.pull_request.head.sha }}
        
    - name: Set Git Info
      id: gitinfo
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # Cache the installed APT file set, not just downloaded .deb archives.
    # Cache keys are isolated by Ubuntu image version. A cold cache installs
    # once; subsequent jobs restore headers/libraries without apt-get update.
    - name: Restore or provision native build dependencies
      uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1.5.3
      with:
        packages: clang-format-14 libsdl2-dev libopenal-dev ninja-build
        version: linux-${{ matrix.os }}-native-v1
    - name: Verify provisioned native build dependencies
      run: |
        command -v clang-format-14
        command -v ninja
        test -f /usr/include/SDL2/SDL.h
        test -f /usr/include/AL/al.h
        test -e /usr/lib/x86_64-linux-gnu/libopenal.so
        pkg-config --exists sdl2
    
    - name: Build Vanilla Conquer
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
      run: |
        cmake --workflow --preset ${{ matrix.preset }}

    # UI-F: the tall command bar and faction sidebar skins are compiled only
    # with WC_COMMAND_BAR_TALL (default OFF on native); keep that path building.
    - name: Build VanillaTD with WC_COMMAND_BAR_TALL=ON
      if: ${{ matrix.preset == 'testing' }}
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        cmake -S . -B build/command-bar-tall -G Ninja -DBUILD_VANILLATD=ON -DBUILD_VANILLARA=OFF \
          -DBUILD_REMASTERTD=OFF -DBUILD_REMASTERRA=OFF -DBUILD_TOOLS=OFF -DBUILD_TESTS=OFF \
          -DWC_COMMAND_BAR_TALL=ON
        cmake --build build/command-bar-tall --target VanillaTD

    - name: Check formatting
      if: ${{ matrix.compiler.cc == 'clang' && matrix.preset == 'testing'}} 
      run: |
        cmake --build build/testing --target format
        git diff --exit-code
        
    - name: Create archives
      if: ${{ matrix.preset != 'testing' &&  matrix.preset != 'nonet' }}
      run: |
        cp ./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd ./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd.dbg
        cp ./build/${{ matrix.preset }}/RelWithDebInfo/vanillara ./build/${{ matrix.preset }}/RelWithDebInfo/vanillara.dbg
        strip --strip-all ./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd
        strip --strip-all ./build/${{ matrix.preset }}/RelWithDebInfo/vanillara
        objcopy --add-gnu-debuglink=./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd.dbg ./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd
        objcopy --add-gnu-debuglink=./build/${{ matrix.preset }}/RelWithDebInfo/vanillara.dbg ./build/${{ matrix.preset }}/RelWithDebInfo/vanillara
        mkdir artifact
        7z a artifact/vanilla-conquer-${{ matrix.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd ./build/${{ matrix.preset }}/RelWithDebInfo/vanillara
        7z a artifact/vanilla-conquer-${{ matrix.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ matrix.preset }}/RelWithDebInfo/vanillatd.dbg ./build/${{ matrix.preset }}/RelWithDebInfo/vanillara.dbg

    - name: Add internal tools to archive
      if: ${{ matrix.preset == 'internal' }}
      run: |
        cp ./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix ./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix.dbg
        objcopy --add-gnu-debuglink=./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix.dbg ./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix
        strip --strip-all ./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix
        7z a artifact/vanilla-conquer-${{ matrix.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix
        7z a artifact/vanilla-conquer-${{ matrix.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ matrix.preset }}/RelWithDebInfo/vanillamix.dbg
    
    - name: Upload artifact
      if: ${{ matrix.preset != 'testing' &&  matrix.preset != 'nonet' }}
      uses: actions/upload-artifact@v4
      with:
        name: vanilla-conquer-${{ matrix.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64
        path: artifact
        
  publish-release:
    # Publishing is not a build/test check. It runs once after the matrix and
    # is the only job with permission to write a GitHub Release.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/vanilla' || startsWith(github.ref, 'refs/tags/')) }}
    needs: vanilla-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: world-conquer-release-${{ github.ref == 'refs/heads/vanilla' && 'latest-linux' || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vanilla-conquer-*-linux-*
          path: artifact
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: ci-scripts
      - name: Remove superseded builds from the rolling release
        if: ${{ github.ref == 'refs/heads/vanilla' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci-scripts/.github/scripts/prune-release-assets.sh latest "${{ github.sha }}" artifact
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref == 'refs/heads/vanilla' && 'Development Build' || github.ref_name }}
          tag_name: ${{ github.ref == 'refs/heads/vanilla' && 'latest' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/vanilla' }}
          files: artifact/*
          fail_on_unmatched_files: true
