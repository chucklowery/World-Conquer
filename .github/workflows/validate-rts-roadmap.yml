name: Validate full RTS milestone roadmap

on:
  pull_request:
    paths:
      - 'docs/rts-milestones/**'
      - '.github/workflows/validate-rts-roadmap.yml'
  push:
    paths:
      - 'docs/rts-milestones/**'
      - '.github/workflows/validate-rts-roadmap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-rts-roadmap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  roadmap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate milestone registry, prompt links and dependency waves
        run: node docs/rts-milestones/validate-roadmap.js
