name: Legacy RTS demo regression

on:
  pull_request:
  push:
    branches: [vanilla]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rts-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: foundation (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Legacy R00-R20 demo regression (ADR-0003). The sanitizer leg is
        # optional: it runs only on manual dispatch until milestone M7.
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["regular","asan-ubsan"]' || '["regular"]') }}
    env:
      RTS_SANITIZE: ${{ matrix.mode == 'asan-ubsan' && '1' || '0' }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          g++ --version
          node --version
      - name: Check native simulation, bridge, content and replay determinism
        env:
          R20_CROWDING_METRICS_PATH: ${{ runner.temp }}/r20-crowding-${{ matrix.mode }}.json
        run: bash scripts/check-rts-foundation.sh
      - name: Upload R20 host crowding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-crowding-${{ matrix.mode }}
          path: ${{ runner.temp }}/r20-crowding-${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 30
