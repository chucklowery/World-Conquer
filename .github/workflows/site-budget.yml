name: Play site budget

# M4: measure what a visitor to the published play site downloads and how long
# the game takes to reach its menu in Chromium, Firefox and WebKit
# (browser/engine/check-site-budget.js), and fail if a roadmap M4 budget is
# exceeded in any of them. Runs after each Pages publish, or by
# hand against any URL (with report_only to measure without failing). A failure
# after a publish means the deployed site broke a budget: fix it or revert.
on:
  workflow_run:
    workflows: ["Publish World-Conquer to GitHub Pages"]
    types: [completed]
    branches: [vanilla]
  # A change to the measurement itself is checked against the live site.
  pull_request:
    paths:
      - 'browser/engine/check-site-budget.js'
      - '.github/workflows/site-budget.yml'
  workflow_dispatch:
    inputs:
      url:
        description: Site to measure
        default: https://chucklowery.github.io/World-Conquer/
        required: true
      report_only:
        description: Report the numbers without failing on a missed budget
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-budget
  cancel-in-progress: false

jobs:
  measure:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Chromium, Firefox and WebKit
        run: |
          npm --prefix browser/engine install --no-save --no-package-lock playwright@1.56.1
          npm exec --prefix browser/engine -- playwright install chromium firefox webkit
          npm exec --prefix browser/engine -- playwright install-deps chromium firefox webkit
      - name: Measure the published site
        env:
          SITE_URL: ${{ inputs.url || 'https://chucklowery.github.io/World-Conquer/' }}
          SITE_BUDGET_REPORT_ONLY: ${{ inputs.report_only && '1' || '0' }}
        run: node browser/engine/check-site-budget.js "$SITE_URL" build/site-budget
      - name: Publish the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-budget
          path: build/site-budget/**
          if-no-files-found: warn
